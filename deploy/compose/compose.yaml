name: querymind

services:
  # Only n8n uses this. The backend does not: it is SQLite-only
  # (app/services/sessions/metadata_db.py), so postgres sits in the same opt-in
  # profile rather than starting for everyone and gating the backend's startup
  # on a database it never opens.
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    profiles: [with-n8n]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-querymind}
      POSTGRES_USER: ${POSTGRES_USER:-querymind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-querymind}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [querymind]

  neo4j:
    image: neo4j:5.26.3
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks: [querymind]

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [querymind]

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-../../.runtime/production.env}
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CHROMA_PERSIST_DIR: /app/data/chroma
      # No DATABASE_URL here on purpose. It used to be set to a
      # postgresql+asyncpg:// URL that the application silently ignored --
      # `_get_db_path` honours only `sqlite:///` and falls back to
      # ./data/querymind.db for anything else, which the app_data volume
      # persists. A deployment manifest that names a database nothing connects
      # to is worse than one that names none.
    volumes:
      - chroma_data:/app/data/chroma
      - chunks_data:/app/data/chunks
      - app_data:/app/data
      - logs_data:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [querymind]

  frontend:
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks: [querymind]

  n8n:
    image: n8nio/n8n:1.94.1
    restart: unless-stopped
    profiles: [with-n8n]
    environment:
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Asia/Shanghai
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-querymind}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks: [querymind]

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  redis_data:
  chroma_data:
  chunks_data:
  app_data:
  logs_data:
  n8n_data:

networks:
  querymind:
    driver: bridge
