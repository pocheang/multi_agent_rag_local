# Nginx security headers configuration
# Include this in your nginx server block for production

# Security Headers
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Enable HSTS (HTTP Strict Transport Security) - HTTPS only
# Uncomment the following line in production with HTTPS
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Hide Nginx version
server_tokens off;

# Prevent clickjacking
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Cookie security
# Note: Set these on your backend Set-Cookie headers
# Set-Cookie: session_id=...; Secure; HttpOnly; SameSite=Strict

# Rate limiting (adjust as needed)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

location /auth/login {
    limit_req zone=login_limit burst=3 nodelay;
    proxy_pass http://backend;
}

location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://backend;
}
