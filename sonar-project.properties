# Configuration for the scanner run from CI.
#
# This project has been analysed by SonarCloud's Automatic Analysis, which cannot
# read a coverage report -- so the test suite has produced a coverage number that
# never reached SonarCloud, and "is this code tested?" has had no answer there.
#
# Switching to the CI scanner takes two things done once in SonarCloud, neither of
# which lives in this repository:
#
#   1. add a SONAR_TOKEN secret to this GitHub repository, and
#   2. turn Automatic Analysis off for the project.
#
# They have to happen together. The scanner refuses to run while Automatic
# Analysis is enabled, and the workflow step is skipped until the secret exists,
# so doing only one leaves the current analysis in place rather than half a new
# one. Uploading coverage cannot turn the quality gate red: its five conditions
# are the two ratings, duplication and hotspot review, and none of them is
# coverage.
#
# Not switching is a legitimate choice, and this file is not a half-finished step
# towards doing so. Nothing here costs anything while the secret is absent: CI
# writes both coverage reports on every run and prints the total, the scanner step
# is skipped, and Automatic Analysis carries on as it always has. What the switch
# buys is that "is this code tested?" gets an answer in SonarCloud rather than one
# reached by grep, and that coverage on *new* code becomes visible in review.
#
# What it costs, so the trade is on one page: analysis stops being SonarCloud's
# job and becomes CI's, so a run that fails before the scanner step produces no
# analysis at all, where Automatic Analysis is zero-maintenance. The scan also
# adds a minute or two per run.

sonar.projectKey=pocheang_querymind
sonar.organization=pocheang

# Analysis scope is left to the scanner's defaults, which keeps it what Automatic
# Analysis was already looking at. The one thing this file adds is coverage.
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
