# Alertmanager Configuration for QueryMind System

global:
  resolve_timeout: 5m
  # SMTP configuration (optional)
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alerts@example.com'
  # smtp_auth_username: 'your-email@gmail.com'
  # smtp_auth_password: 'your-app-password'

# Alert routing tree
route:
  group_by: ['alertname', 'component', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # Warning alerts - less urgent
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 4h

    # Info alerts - monitoring only
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 5m
      repeat_interval: 12h

# Inhibition rules - suppress alerts based on other alerts
inhibit_rules:
  # Suppress warning alerts if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['component', 'instance']

  # Suppress individual service alerts if system is down
  - source_match:
      alertname: 'SystemUnhealthy'
    target_match_re:
      alertname: '.*Unreachable'

# Receivers - notification destinations
receivers:
  # Default receiver - webhook to RAG API
  - name: 'default'
    webhook_configs:
      - url: 'http://host.docker.internal:8000/webhooks/alerts'
        send_resolved: true

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://host.docker.internal:8000/webhooks/alerts'
        send_resolved: true
    # Uncomment to enable Slack
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     channel: '#rag-critical'
    #     title: '🚨 Critical Alert: {{ .GroupLabels.alertname }}'
    #     text: |-
    #       {{ range .Alerts }}
    #       *Alert:* {{ .Annotations.summary }}
    #       *Description:* {{ .Annotations.description }}
    #       *Action:* {{ .Annotations.action }}
    #       *Severity:* {{ .Labels.severity }}
    #       {{ end }}
    # Uncomment to enable PagerDuty
    # pagerduty_configs:
    #   - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
    #     description: '{{ .GroupLabels.alertname }}: {{ .Annotations.summary }}'
    # Uncomment to enable Email
    # email_configs:
    #   - to: 'oncall@example.com'
    #     from: 'alerts@example.com'
    #     subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
    #     html: |-
    #       <h2>Critical Alert</h2>
    #       {{ range .Alerts }}
    #       <p><strong>{{ .Annotations.summary }}</strong></p>
    #       <p>{{ .Annotations.description }}</p>
    #       <p><em>Action: {{ .Annotations.action }}</em></p>
    #       {{ end }}

  # Warning alerts - Slack only
  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://host.docker.internal:8000/webhooks/alerts'
        send_resolved: true
    # Uncomment to enable Slack
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     channel: '#rag-warnings'
    #     title: '⚠️ Warning: {{ .GroupLabels.alertname }}'
    #     text: |-
    #       {{ range .Alerts }}
    #       *Alert:* {{ .Annotations.summary }}
    #       *Description:* {{ .Annotations.description }}
    #       {{ end }}

  # Info alerts - webhook only
  - name: 'info-alerts'
    webhook_configs:
      - url: 'http://host.docker.internal:8000/webhooks/alerts'
        send_resolved: false

# Templates for custom notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'
