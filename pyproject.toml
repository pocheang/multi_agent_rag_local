[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "querymind"
version = "0.6.2.1"
description = "QueryMind - Enterprise intelligent Q&A engine with multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
# Core dependencies: smallest set that boots the FastAPI backend, vector store,
# graph integration, query orchestration, and basic PDF/text ingestion.
# Heavy ML/OCR stacks live in extras (see [project.optional-dependencies]).
dependencies = [
  "fastapi>=0.138.0,<1.0",
  "uvicorn>=0.49.0,<1.0",
  "pydantic>=2.13.0,<3.0",
  "pydantic-settings>=2.14.0,<3.0",
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langgraph-cli[inmem]>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langchain-chroma>=0.2.0",
  "chromadb>=0.5.5",
  "neo4j>=5.24.0",
  "langchain-openai>=1.2.0,<2.0",
  "openai>=2.44.0,<3.0",
  "langchain-anthropic>=1.4.0,<2.0",
  "langchain-ollama>=0.2.0",
  "pypdf>=5.0.0",
  "Pillow>=10.0.0",
  "python-dotenv>=1.2.0,<2.0",
  "ddgs>=8.0.0",
  "httpx>=0.28.0,<1.0",
  "orjson>=3.10.0",
  "tenacity>=9.0.0",
  "rank-bm25>=0.2.2",
  "jieba>=0.42.1",
  "python-multipart>=0.0.32,<1.0",
  "redis>=5.0.0",
  "authlib>=1.3.0",
  "itsdangerous>=2.1.0",
  "scikit-learn>=1.3.0",
  "aiofiles>=23.2.0",
  "psutil>=7.0.0,<8.0",
  "mcp>=1.24.0,<2.0",
  "sqlalchemy[asyncio]>=2.0.0,<3.0",
  "aiosqlite>=0.20.0,<1.0",
  "asyncpg>=0.29.0,<1.0"
]

[project.optional-dependencies]
# Tesseract-based OCR for image and scanned-PDF ingestion. Requires the
# native ``tesseract`` binary on PATH (see TESSERACT_CMD env var).
ocr = [
  "pytesseract>=0.3.10",
]
# PaddleOCR layout-aware OCR (Chinese-friendly). Adds ~500MB of native libs.
paddle = [
  "paddlepaddle>=2.6.0",
  "paddleocr>=2.7.0",
]
# Docling document conversion for structured PDF/DOCX/PPTX parsing.
docling = [
  "docling>=2.93.0",
]
# Spreadsheet ingestion. DOCX/PPTX use Docling with a package-XML fallback.
office = [
  "openpyxl>=3.1.0",
  "pandas>=2.2.0,<3.0",
  "xlrd>=2.0.1",
]
# PDF/image/table extraction support.
multimodal = [
  "pandas>=2.2.0,<3.0",
  "PyMuPDF>=1.24.0",
  "pdfplumber>=0.11.0",
  "tabulate>=0.9.0",
]
# Cross-encoder reranking via sentence-transformers (BAAI/bge-reranker-v2-m3
# by default). Falls back to lexical scoring when missing.
reranker = [
  "sentence-transformers>=3.0.1",
]
# Convenience meta-extra: equivalent to the historical full install.
full = [
  "querymind[ocr,paddle,docling,office,reranker,multimodal]",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.5.0",
  "reportlab>=4.0.0",
  "ruff>=0.6.0",
  "pre-commit>=3.7.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
# Note (2026-08-28): pytest/coverage configuration was removed here ahead of the v0.7
# rewrite — `tests/` was cleared and will be rebuilt against the new architecture.

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".venv",
  ".tmp",
  "artifacts",
  "frontend",
  "data",
  ".langgraph_api",
  "internal_docs",
  "**/__pycache__",
]

[tool.ruff.lint]
# Conservative starter set; expand later as the codebase tightens.
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter, many long log/string lines)
  "B008",  # function calls in argument defaults (FastAPI Depends/Query pattern)
  "B904",  # raise from inside except (project intentionally hides chains in some places)
  "UP007", # X | Y syntax for Optional (mixed style across codebase)
]

[tool.ruff.lint.per-file-ignores]
"app/services/agent_document_filter.py" = ["T201"]  # demo block under __main__
"app/evaluation/service.py" = ["T201"]       # CLI-style table printing is intentional

[tool.ruff.lint.isort]
known-first-party = ["app"]
