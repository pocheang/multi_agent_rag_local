name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job level, not step level: a step's own `env:` is not readable from that
    # step's `if:`, and the scan below is conditional on this being set.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar reads SCM blame to decide what counts as new code, and every
          # condition on this project's quality gate is a new-code condition. A
          # shallow clone has no blame to read.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Lint first: it needs no project dependencies, so a style failure reports
      # in seconds instead of after the full install.
      - name: Install ruff
        # Exact, and the same version pyproject's dev extra pins. `>=` meant CI
        # picked up every new release, so the formatter changed without anyone
        # touching the code -- which is how four green-locally commits failed
        # here in a row.
        run: 'pip install --only-binary :all: "ruff==0.16.5"'

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Install dependencies
        # From the lock, not from the ranges in pyproject.toml: every version is
        # pinned and every archive hashed, so pip refuses bytes that do not match
        # and refuses to resolve anything the lock does not name. Regenerate with
        # `make lock`; tests/core/test_dependency_locks_are_current.py fails if
        # pyproject moves and the lock does not.
        #
        # --only-binary keeps setup.py from running. Two packages are exempted
        # because they publish no wheel at all -- not for this platform, for any:
        # jieba, and forbiddenfruit (pulled in by blockbuster). The order of the
        # flags matters: --only-binary :all: clears the no-binary set, so it has
        # to come first.
        #
        # That list is produced by `python scripts/check_lock_wheels.py`, which
        # asks PyPI about the whole lock in one pass. Finding these one red build
        # at a time is exactly what that script exists to stop -- it happened
        # twice before it was written.
        run: 'pip install --only-binary :all: --no-binary forbiddenfruit,jieba -r requirements/ci.txt'

      # The project itself is deliberately not installed. `app/` sits at the
      # repository root and every step below runs from there, so it imports from
      # the checkout; nothing reads distribution metadata and there are no entry
      # points, which is what an install would add. Verified by uninstalling it
      # and running the whole suite: 605 passed.
      #
      # It also removes the last unlocked `pip install` from this job, which is
      # what githubactions:S8544 was pointing at -- `pip install -e . --no-deps`
      # resolves nothing and locks nothing, so the rule was right about the shape
      # and the answer was to stop doing it rather than to pin it.

      - name: Endpoint census
        # Guards against a refactor silently dropping routers. Counts OpenAPI
        # operations, not len(app.routes): FastAPI 0.138+ stores an
        # _IncludedRouter wrapper instead of flattening child routes, so that
        # count varies by version (30 on 0.138.2 vs 156 on 0.135.3).
        run: >-
          python -c "import app.api.main as m; d = m.app.openapi()['paths'];
          n = sum(1 for i in d.values() for k in i if k in {'get','post','put','patch','delete'});
          print(f'{n} operations');
          assert n >= 140, f'endpoint count collapsed to {n}'"

      - name: Tests
        # Coverage is written whether or not the scan below runs, so an upload
        # that never happens shows up as a missing report rather than as a
        # metric that quietly stays empty -- which is the state this project was
        # in until now: Automatic Analysis cannot read a coverage report, so the
        # suite's coverage had never reached SonarCloud at all.
        run: pytest tests/ -q --cov=app --cov-report=xml:coverage.xml

      - name: Coverage total
        # One line in the log, so the number is visible on a run where the scan
        # is skipped.
        run: >-
          python -c "import xml.etree.ElementTree as ET;
          rate = float(ET.parse('coverage.xml').getroot().get('line-rate', 0));
          print('line coverage: {:.1f}%'.format(rate * 100))"

      - name: SonarCloud scan
        # Skipped until a SONAR_TOKEN secret exists, so this change lands green
        # and is switched on deliberately. Turning it on also means turning
        # Automatic Analysis off in SonarCloud: the scanner refuses to run while
        # that is enabled. See sonar-project.properties.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      # Gates on errors. The threshold is a ratchet at the current warning
      # count (25: react-refresh, exhaustive-deps, unused-vars, explicit-any),
      # so no new warning can land while those are worked through separately.
      # Lower it as they are fixed; never raise it.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # Shape and depth scale, as a ratchet. The chat screen once carried eight
      # radii and eighteen distinct shadows at the same time; that drift is
      # cheap to prevent and expensive to undo. Existing counts are frozen per
      # file in scripts/design-scale-baseline.json -- a file may improve, never
      # regress, and a new file starts at zero.
      - name: Design scale
        run: npm run lint:design

      # Store-reset coverage: the Zustand stores live for the lifetime of the
      # tab, so a field that survives logout shows the next person on a shared
      # browser the previous one's data. The test discovers fields rather than
      # listing them, so it catches one added to the store but forgotten in
      # INITIAL_STATE.
      - name: Tests
        run: npm test -- --run

      - name: Build
        run: npm run build
